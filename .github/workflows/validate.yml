name: validate-marketplace

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Validate marketplace structure
        run: python3 scripts/validate.py

      # Claude Code moves SessionStart context over ~10 KB into a file and shows
      # Claude only a 2 KB preview, so the injected instructions silently stop
      # working. Keep every combination well under that.
      - name: branch8-jira-check context size
        run: bash plugins/branch8-jira-check/tests/context-size.sh

      # Rather than failing the PR for a forgotten version bump, just do it and
      # push the commit. Forgetting is the normal case, not an error worth blocking on.
      - name: Auto-bump versions for changed plugins
        if: github.event_name == 'pull_request'
        run: |
          python3 scripts/check_version_bump.py "${{ github.event.pull_request.base.sha }}" --fix
          if ! git diff --quiet; then
            git config user.name "claude-plugins-bot"
            git config user.email "claude-plugins-bot@users.noreply.github.com"
            git commit -am "chore: bump plugin versions"
            git push origin HEAD:"${{ github.head_ref }}"
          fi
